<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão Lead — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red:#A4161A; --red-d:#660708; --red-l:#fdf0f0;
  --black:#161A1D; --gray:#B1A7A6; --gray-l:#e8e4e4;
  --bg:#F5F3F4; --white:#ffffff; --border:#ddd9d9;
  --muted:#7a7070; --text:#1a1410;
  --green:#1A6B3A; --green-l:#e8f5ee;
  --amber:#7A5C00; --amber-l:#fdf5e0;
  --blue:#1A3A6B; --blue-l:#e8eef5;
  --purple:#4A1A6B; --purple-l:#f0e8f5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}

/* ── HEADER ── */
.site-header{background:var(--black);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--red)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-img{height:38px;display:block}
.header-right{display:flex;align-items:center;gap:12px}
.user-badge{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);background:#222;padding:4px 10px;border-radius:3px}
.perfil-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.perfil-admin{background:#26215C;color:#CECBF6}
.perfil-coordenadora{background:#085041;color:#9FE1CB}
.perfil-sdr{background:#633806;color:#FAC775}
.perfil-cliente{background:#712B13;color:#F5C4B3}
.logout-btn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border:1px solid #444;border-radius:3px;background:transparent;color:var(--gray);cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black)}
.login-card{background:var(--bg);border-radius:8px;padding:2.5rem;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:1.5rem}
.login-logo img{height:52px}
.login-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;color:var(--black);text-align:center;margin-bottom:.25rem}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.form-input{width:100%;padding:10px 12px;font-size:14px;font-family:'Barlow',sans-serif;border:1px solid var(--border);border-radius:4px;background:var(--white);color:var(--text);transition:border-color .15s}
.form-input:focus{outline:none;border-color:var(--red)}
.login-btn{width:100%;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:none;border-radius:4px;background:var(--red);color:#fff;cursor:pointer;transition:background .15s;margin-top:.5rem}
.login-btn:hover{background:var(--red-d)}
.login-btn:disabled{background:var(--gray-l);cursor:not-allowed}
.login-error{background:var(--red-l);border-left:3px solid var(--red);padding:8px 12px;font-size:13px;color:var(--red-d);border-radius:0 4px 4px 0;margin-top:.75rem;display:none}

/* ── PAINEL PRINCIPAL ── */
.page-wrap{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;color:var(--black);margin-bottom:.25rem}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:1.75rem}

/* ── CARDS DE MÓDULO ── */
.modules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:2rem}
.module-card{background:var(--white);border:1px solid var(--border);border-top:3px solid var(--black);border-radius:0 0 8px 8px;padding:1.25rem;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px}
.module-card:hover{border-top-color:var(--red);box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.module-card.active{border-top-color:var(--red)}
.module-num{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.module-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;color:var(--black);line-height:1.1}
.module-desc{font-size:12px;color:var(--muted);line-height:1.4}
.module-arrow{font-size:18px;color:var(--gray-l);margin-top:auto;transition:all .15s}
.module-card:hover .module-arrow{color:var(--red)}
.module-card.op{border-top-color:var(--red)}
.module-card.onb{border-top-color:var(--green)}
.module-card.rec{border-top-color:var(--purple)}
.module-card.fin{border-top-color:var(--amber)}
.module-card.hidden{display:none}

/* ── SEÇÃO INTERNA ── */
.section-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;color:var(--black)}
.back-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;transition:color .12s}
.back-btn:hover{color:var(--red)}

/* ── TABELA ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);padding:8px 10px;text-align:left;background:var(--bg)}
.data-table td{padding:10px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg)}
.status-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.status-ok{background:var(--green-l);color:var(--green)}
.status-risco{background:var(--amber-l);color:var(--amber)}
.status-critico{background:var(--red-l);color:var(--red-d)}

/* ── LOADING ── */
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:13px;font-style:italic}
.loading::before{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ÁREA CLIENTE ── */
.client-welcome{background:var(--black);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between}
.client-welcome-text h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;text-transform:uppercase;color:var(--white)}
.client-welcome-text p{font-size:13px;color:var(--gray);margin-top:4px}
.step-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1rem;display:flex;align-items:flex-start;gap:1rem}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-num.done{background:var(--green)}
.step-content h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;color:var(--black);margin-bottom:4px}
.step-content p{font-size:13px;color:var(--muted)}
.step-action{margin-top:.75rem}
.btn-primary{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:3px;border:none;background:var(--red);color:#fff;cursor:pointer;transition:background .15s;text-decoration:none;display:inline-block}
.btn-primary:hover{background:var(--red-d)}
.btn-secondary{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:3px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:var(--green-l)}
.btn-approve{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:3px;border:none;background:var(--green);color:#fff;cursor:pointer;transition:background .15s}
.btn-approve:hover{background:#0F5030}

/* ── FORMULÁRIO ONBOARDING INLINE ── */
.onb-form{margin-top:1rem}
.onb-section{margin-bottom:1.5rem}
.onb-section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:.75rem;padding-bottom:4px;border-bottom:1px solid var(--border)}
.onb-q{margin-bottom:.875rem}
.onb-label{font-size:13px;font-weight:500;color:var(--black);display:block;margin-bottom:4px}
.onb-hint{font-size:11px;color:var(--muted);margin-bottom:6px}
.onb-input{width:100%;padding:8px 10px;font-size:13px;font-family:'Barlow',sans-serif;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);resize:vertical;transition:border-color .15s}
.onb-input:focus{outline:none;border-color:var(--red)}
.onb-tags{display:flex;flex-wrap:wrap;gap:6px}
.onb-tag{padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);cursor:pointer;background:var(--bg);color:var(--muted);transition:all .12s;user-select:none}
.onb-tag.sel{background:var(--red);color:#fff;border-color:var(--red)}
.onb-submit{margin-top:1rem;display:flex;gap:10px;align-items:center}

/* ── STATS CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1.5rem}
.stat-card{background:var(--bg);border-radius:6px;padding:1rem;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--black)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em;font-family:'Barlow Condensed',sans-serif;font-weight:600}

@media(max-width:600px){.page-wrap{padding:1.5rem 1rem}.modules-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
const API = 'https://script.google.com/macros/s/AKfycbylKgNXAJIiwl27Rdqf5a_6wPt-MCBwSsMEq-0dcsIfsoeXgixdYCqdeWhvXvtAvSM9/exec';

let SESSION = null;

// ── LOGO base64 real (carrega do arquivo original) ──────────
// A imagem está inline acima como placeholder curto;
// para produção substitua pelo base64 completo do Logo.png

// ── LOGIN ────────────────────────────────────────────────────
async function doLogin() {
  const usuario = document.getElementById('inp-usuario').value.trim();
  const senha   = document.getElementById('inp-senha').value.trim();
  if (!usuario || !senha) return;

  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  err.style.display = 'none';

  try {
    const res  = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ acao: 'login', usuario, senha })
    });
    const data = await res.json();

    if (data.ok) {
      SESSION = { usuario: data.usuario, perfil: data.perfil.toLowerCase(), projeto: data.projeto };
      abrirPainel();
    } else {
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch(e) {
    err.textContent = 'Erro de conexão. Tente novamente.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function doLogout() {
  SESSION = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-panel').style.display = 'none';
  document.getElementById('inp-senha').value = '';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').textContent = 'Entrar';
}

// ── ABRIR PAINEL ─────────────────────────────────────────────
function abrirPainel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-panel').style.display = 'block';

  const p = SESSION.perfil;
  document.getElementById('hdr-usuario').textContent = SESSION.usuario;
  const pb = document.getElementById('hdr-perfil');
  pb.textContent = p;
  pb.className = 'perfil-badge perfil-' + p;

  if (p === 'cliente') {
    renderCliente();
  } else {
    renderHub();
  }
}

// ── HUB (Admin / Coordenadora / SDR) ─────────────────────────
function renderHub() {
  const p = SESSION.perfil;
  const mc = document.getElementById('main-content');

  const modulos = [
    {
      id:'op', cls:'op', num:'01', nome:'Operacional',
      desc:'Dashboard de KPIs, clientes ativos e atividades dos SDRs',
      visivel: true,
      onclick: 'renderOperacional()'
    },
    {
      id:'onb', cls:'onb', num:'02', nome:'Onboarding',
      desc:'Formulários e playbooks dos clientes',
      visivel: p === 'admin' || p === 'coordenadora',
      onclick: "window.open('https://conexaolead-dot.github.io/checklist_onboarding/','_blank')"
    },
    {
      id:'rec', cls:'rec', num:'03', nome:'Recrutamento',
      desc:'Candidatos, aprovações e processo seletivo',
      visivel: p === 'admin' || p === 'coordenadora',
      onclick: "alert('Módulo em construção')"
    },
    {
      id:'fin', cls:'fin', num:'04', nome:'Financeiro',
      desc:'Modelo financeiro e simulador de preço',
      visivel: p === 'admin',
      onclick: "alert('Módulo em construção')"
    }
  ];

  mc.innerHTML = `
    <div class="page-title">Painel Conexão Lead</div>
    <div class="page-sub">Bem-vindo, ${SESSION.usuario}. Selecione um módulo abaixo.</div>
    <div class="modules-grid" id="modules-grid"></div>
    <div id="module-content"></div>`;

  const grid = document.getElementById('modules-grid');
  modulos.forEach(m => {
    if (!m.visivel) return;
    const div = document.createElement('div');
    div.className = 'module-card ' + m.cls;
    div.innerHTML = `
      <div class="module-num">${m.num}</div>
      <div class="module-name">${m.nome}</div>
      <div class="module-desc">${m.desc}</div>
      <div class="module-arrow">→</div>`;
    div.onclick = () => eval(m.onclick);
    grid.appendChild(div);
  });
}

// ── OPERACIONAL ──────────────────────────────────────────────
async function renderOperacional() {
  const mc = document.getElementById('module-content');
  mc.innerHTML = '<div class="loading">Carregando clientes...</div>';

  try {
    const res  = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'getClientes', perfil:SESSION.perfil, projeto:SESSION.projeto })
    });
    const data = await res.json();

    if (!data.ok) { mc.innerHTML = '<p style="color:var(--red)">Erro: '+data.erro+'</p>'; return; }

    const clientes = data.dados || [];
    const total = clientes.reduce((s,c)=>s+(Number(c.reunioes)||0),0);
    const meta  = clientes.reduce((s,c)=>s+(Number(c.meta)||0),0);
    const pct   = meta > 0 ? Math.round(total/meta*100) : 0;

    mc.innerHTML = `
      <div class="section-wrap">
        <div class="section-header">
          <div class="section-title">Mapa de Clientes Ativos</div>
          <button class="back-btn" onclick="document.getElementById('module-content').innerHTML=''">← Voltar</button>
        </div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-val">${clientes.length}</div><div class="stat-lbl">Clientes</div></div>
          <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Reuniões no mês</div></div>
          <div class="stat-card"><div class="stat-val">${meta}</div><div class="stat-lbl">Meta total</div></div>
          <div class="stat-card"><div class="stat-val">${pct}%</div><div class="stat-lbl">% atingido</div></div>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>SDR</th>
                <th>ICP</th>
                <th>Meta</th>
                <th>Reun.</th>
                <th>%</th>
                <th>Ticket</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${clientes.map(c=>`
              <tr>
                <td><strong>${c.cliente||''}</strong></td>
                <td>${c.sdr||''}</td>
                <td style="font-size:12px;color:var(--muted)">${c.icp||''}</td>
                <td>${c.meta||0}</td>
                <td>${c.reunioes||0}</td>
                <td>${c.pct||'0%'}</td>
                <td style="font-size:12px">${c.ticket||''}</td>
                <td><span class="status-badge ${statusCls(c.status)}">${c.status||''}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch(e) {
    mc.innerHTML = '<p style="color:var(--red)">Erro de conexão com a planilha.</p>';
  }
}

function statusCls(s) {
  if (!s) return '';
  const sl = String(s).toLowerCase();
  if (sl.includes('risco')) return 'status-risco';
  if (sl.includes('crít') || sl.includes('crit')) return 'status-critico';
  return 'status-ok';
}

// ── ÁREA DO CLIENTE ──────────────────────────────────────────
async function renderCliente() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = '<div class="loading">Carregando seu painel...</div>';

      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'getOnboarding', projeto:SESSION.projeto })
    });
    const data = await res.json();
    const onb  = data.dados;

    const onbFeito    = onb && onb.STATUS_ONBOARDING === 'Respondido';
    const playbookOk  = onb && onb.PLAYBOOK_LINK;
    const aprovado    = onb && onb.PLAYBOOK_APROVADO === 'Sim ✓';

    mc.innerHTML = `
      <div class="client-welcome">
        <div class="client-welcome-text">
          <h2>Bem-vindo, ${SESSION.projeto}</h2>
          <p>Acompanhe abaixo as etapas do seu projeto com a Conexão Lead</p>
        </div>
      </div>

      <div class="step-card">
        <div class="step-num ${onbFeito?'done':''}">1</div>
        <div class="step-content">
          <h3>Formulário de Onboarding</h3>
          <p>${onbFeito ? '✓ Formulário respondido. Obrigado!' : 'Preencha o formulário abaixo para que possamos criar o seu Playbook personalizado.'}</p>
          ${!onbFeito ? `<div class="step-action"><button class="btn-primary" onclick="renderFormOnboarding()">Preencher formulário →</button></div>` : ''}
        </div>
      </div>

      <div class="step-card">
        <div class="step-num ${playbookOk?'done':''}">2</div>
        <div class="step-content">
          <h3>Playbook em construção</h3>
          <p>${playbookOk ? 'Seu Playbook está pronto!' : 'Nossa equipe está construindo seu Playbook com base nas suas respostas. Em breve você receberá uma notificação.'}</p>
          ${playbookOk ? `<div class="step-action"><a class="btn-primary" href="${onb.PLAYBOOK_LINK}" target="_blank">Ver Playbook →</a></div>` : ''}
        </div>
      </div>

      <div class="step-card">
        <div class="step-num ${aprovado?'done':''}">3</div>
        <div class="step-content">
          <h3>Validação do Playbook</h3>
          <p>${aprovado ? '✓ Playbook aprovado em ' + (onb.DATA_APROVACAO||'') + '!' : playbookOk ? 'Leia o Playbook e clique em Aprovar quando estiver de acordo.' : 'Aguardando construção do Playbook.'}</p>
          ${playbookOk && !aprovado ? `<div class="step-action"><button class="btn-approve" onclick="aprovarPlaybook()">✓ Aprovar Playbook</button></div>` : ''}
        </div>
      </div>

      <div id="onb-form-area"></div>`;
  } catch(e) {
    mc.innerHTML = '<p style="color:var(--red)">Erro de conexão. Tente novamente.</p>';
  }
}

function toggleTag(id, val, el) {
  const inp = document.getElementById(id);
  let vals = inp.value ? inp.value.split('||') : [];
  const idx = vals.indexOf(val);
  if (idx > -1) { vals.splice(idx,1); el.classList.remove('sel'); }
  else { vals.push(val); el.classList.add('sel'); }
  inp.value = vals.join('||');
}

async function enviarOnboarding() {
  const msg = document.getElementById('onb-msg');
  msg.textContent = 'Enviando...';

  const r = {
    q1:  document.getElementById('q1').value,
    q2:  document.getElementById('q2').value,
    q3:  document.getElementById('q3').value,
    q4:  document.getElementById('q4').value,
    q5:  document.getElementById('q5').value,
    q6:  document.getElementById('q6').value,
    q7:  document.getElementById('q7').value,
    q8:  document.getElementById('q8').value,
    q9:  document.getElementById('q9').value,
    q10: document.getElementById('q10').value,
    q11: document.getElementById('q11').value,
    q12: [document.getElementById('q12a').value, document.getElementById('q12b').value, document.getElementById('q12c').value, document.getElementById('q12d').value].join(' | '),
    q13: document.getElementById('q13').value,
    q14: document.getElementById('q14').value,
    q15: document.getElementById('q15').value,
    q16: document.getElementById('q16').value,
    q17: document.getElementById('q17').value,
    q18: document.getElementById('q18').value,
    q19: document.getElementById('q19').value,
    q20: document.getElementById('q20').value
  };

  try {
    const res  = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'salvarOnboarding', projeto:SESSION.projeto, respostas:r })
    });
    const data = await res.json();
    if (data.ok) {
      msg.style.color = 'var(--green)';
      msg.textContent = '✓ Enviado com sucesso!';
      setTimeout(() => renderCliente(), 1500);
    } else {
      msg.style.color = 'var(--red)';
      msg.textContent = 'Erro: ' + data.erro;
    }
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = 'Erro de conexão. Tente novamente.';
  }
}

async function aprovarPlaybook() {
  if (!confirm('Confirma a aprovação do Playbook?')) return;
  try {
    const res  = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'aprovarPlaybook', projeto:SESSION.projeto })
    });
    const data = await res.json();
    if (data.ok) { alert('Playbook aprovado! Obrigado.'); renderCliente(); }
    else { alert('Erro: ' + data.erro); }
  } catch(e) { alert('Erro de conexão.'); }
}
